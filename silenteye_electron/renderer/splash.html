<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data:"/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
body{font-family:'Orbitron',monospace;-webkit-app-region:drag;background:#040608}

.bg{position:absolute;inset:0}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,180,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,180,255,.05) 1px,transparent 1px);background-size:36px 36px;animation:gp 3s ease-in-out infinite}
@keyframes gp{0%,100%{opacity:.4}50%{opacity:.9}}

.ring{position:absolute;border-radius:50%;border:1px solid rgba(0,180,255,.18);top:50%;left:50%;transform:translate(-50%,-50%);animation:re 3s ease-out infinite}
.r1{width:200px;height:200px;animation-delay:0s}
.r2{width:310px;height:310px;animation-delay:.9s}
.r3{width:420px;height:420px;animation-delay:1.8s}
@keyframes re{0%{opacity:.9;transform:translate(-50%,-50%) scale(.8)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.25)}}

.wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}

/* eye */
.eye-holder{position:relative;width:120px;height:120px;animation:ef 4s ease-in-out infinite}
@keyframes ef{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.scan-bar{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#00e5ff,transparent);top:0;animation:sb 2s ease-in-out infinite;border-radius:1px}
@keyframes sb{0%{top:0%;opacity:0}10%{opacity:1}90%{opacity:1}100%{top:100%;opacity:0}}
svg.eye{width:120px;height:120px;filter:drop-shadow(0 0 24px rgba(0,180,255,.65)) drop-shadow(0 0 50px rgba(0,80,180,.3))}

/* text */
.title{font-size:40px;font-weight:900;letter-spacing:.08em;line-height:1;background:linear-gradient(135deg,#fff 30%,#00b4ff 70%,#00e5ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:tr 1s ease-out .4s both}
.title span{-webkit-text-fill-color:#00b4ff}
.tagline{font-size:9px;font-weight:400;letter-spacing:.52em;color:#00b4ff;opacity:.8;animation:tr .8s ease-out .8s both}
@keyframes tr{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* progress */
.prog-wrap{width:260px;animation:tr 1s ease-out 1s both}
.prog-labels{display:flex;justify-content:space-between;font-family:'Share Tech Mono',monospace;font-size:10px;color:#00b4ff;letter-spacing:.15em;margin-bottom:7px}
.prog-track{height:2px;background:rgba(0,180,255,.15);border-radius:1px;overflow:hidden}
.prog-bar{height:100%;background:linear-gradient(90deg,#0066cc,#00b4ff,#00e5ff);border-radius:1px;width:0%;transition:width 0.4s ease;box-shadow:0 0 10px rgba(0,229,255,.6)}

.status{font-family:'Share Tech Mono',monospace;font-size:10px;color:#4a7090;letter-spacing:.12em;height:14px;animation:tr .5s ease-out 1.1s both}
.dots span{animation:db 1.2s ease-in-out infinite;display:inline-block}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes db{0%,80%,100%{opacity:.2}40%{opacity:1}}

.version-tag{font-family:'Share Tech Mono',monospace;font-size:9px;color:rgba(0,180,255,.4);letter-spacing:.3em;animation:tr 1s ease-out 1.4s both}
</style>
</head>
<body>
<div class="bg">
  <div class="grid"></div>
  <div class="ring r1"></div>
  <div class="ring r2"></div>
  <div class="ring r3"></div>
</div>

<div class="wrap">
  <div class="eye-holder">
    <div class="scan-bar"></div>
    <svg class="eye" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="ig" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#00e5ff" stop-opacity=".9"/>
          <stop offset="45%" stop-color="#00b4ff" stop-opacity=".65"/>
          <stop offset="100%" stop-color="#0033aa" stop-opacity=".25"/>
        </radialGradient>
        <radialGradient id="pupg" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#001428"/>
          <stop offset="100%" stop-color="#00060f"/>
        </radialGradient>
      </defs>
      <path d="M6 60 Q60 16 114 60 Q60 104 6 60Z" fill="url(#ig)" opacity=".14"/>
      <circle cx="60" cy="60" r="30" fill="url(#ig)" opacity=".35"/>
      <circle cx="60" cy="60" r="30" stroke="#00b4ff" stroke-width="1.4" fill="none" opacity=".6"/>
      <circle cx="60" cy="60" r="24" stroke="#00e5ff" stroke-width=".5" fill="none" opacity=".35"/>
      <circle cx="60" cy="60" r="17" stroke="#00b4ff" stroke-width=".5" fill="none" opacity=".45"/>
      <circle cx="60" cy="60" r="12" fill="url(#pupg)"/>
      <circle cx="60" cy="60" r="12" stroke="#002244" stroke-width="1" fill="none"/>
      <circle cx="65" cy="55" r="3.5" fill="white" opacity=".85"/>
      <circle cx="67" cy="57" r="1.2" fill="white" opacity=".45"/>
      <text x="46" y="44" font-family="monospace" font-size="5" fill="#00e5ff" opacity=".55">10</text>
      <text x="68" y="44" font-family="monospace" font-size="5" fill="#00e5ff" opacity=".55">01</text>
      <text x="40" y="63" font-family="monospace" font-size="5" fill="#00b4ff" opacity=".45">1</text>
      <text x="77" y="63" font-family="monospace" font-size="5" fill="#00b4ff" opacity=".45">0</text>
      <text x="46" y="81" font-family="monospace" font-size="5" fill="#00e5ff" opacity=".55">01</text>
      <text x="68" y="81" font-family="monospace" font-size="5" fill="#00e5ff" opacity=".55">10</text>
      <path d="M6 60 Q60 16 114 60" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" opacity=".65"/>
      <path d="M6 60 Q60 104 114 60" stroke="#00b4ff" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".55"/>
      <rect x="4"  y="46" width="5" height="5" fill="white"  opacity=".55" rx="1"/>
      <rect x="14" y="36" width="4" height="4" fill="#00e5ff" opacity=".4"  rx="1"/>
      <rect x="1"  y="38" width="3" height="3" fill="white"  opacity=".3"  rx="1"/>
      <rect x="20" y="32" width="5" height="5" fill="#00b4ff" opacity=".45" rx="1"/>
    </svg>
  </div>

  <div>
    <div class="title">Silent<span>Eye</span></div>
    <div class="tagline" style="text-align:center;margin-top:8px">SEE BEYOND THE IMAGE</div>
  </div>

  <div class="prog-wrap">
    <div class="prog-labels">
      <span>INITIALIZING</span>
      <span id="pct">0%</span>
    </div>
    <div class="prog-track"><div class="prog-bar" id="bar"></div></div>
  </div>

  <div class="status">
    <span id="msg">Loading engine</span>
    <span class="dots"><span>.</span><span>.</span><span>.</span></span>
  </div>

  <div class="version-tag">MULTIMEDIA MALWARE SCANNER · v1.0</div>
</div>

<script>
const msgs = ['Loading engine','Connecting hash DB','Initializing YARA','Loading ML models','Engine ready'];
let idx = 0;
const msgEl = document.getElementById('msg');
const barEl = document.getElementById('bar');
const pctEl = document.getElementById('pct');

// Status message cycling
const msgTimer = setInterval(() => {
  idx++;
  if (idx < msgs.length) msgEl.textContent = msgs[idx];
  if (idx >= msgs.length) clearInterval(msgTimer);
}, 900);

// Progress bar + pct — JS-driven so text and bar always match
const progSteps = [0,18,42,72,90,100];
let progStep = 0;
function paintProgStep(){
  if (barEl) barEl.style.width = progSteps[progStep]+'%';
  if (pctEl) pctEl.textContent = progSteps[progStep]+'%';
}
paintProgStep(); // paint 0% immediately
const pctTimer = setInterval(() => {
  progStep++;
  if (progStep >= progSteps.length){ clearInterval(pctTimer); return; }
  paintProgStep();
}, 700);

// After 5s signal main process to transition
setTimeout(() => {
  try { window.silentEye?.splashDone(); } catch {}
}, 5000);
</script>
</body>
</html>
